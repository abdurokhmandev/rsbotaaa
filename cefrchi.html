<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        #loader { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .card { background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .btn { background: #6366f1; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        .error-box { text-align: center; color: #f43f5e; padding: 20px; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p id="loader-status" style="margin-top: 15px; font-size: 14px; color: #94a3b8;">Yuklanmoqda...</p>
    </div>

    <div id="app-content" class="hidden">
        <h2 id="user-name">Salom, Admin</h2>
        <div class="card">
            <h3>Statistika</h3>
            <p>Foydalanuvchilar: <span id="s-users">...</span></p>
            <p>Sessiyalar: <span id="s-tests">...</span></p>
        </div>

        <div class="card">
            <h3>Xabar yuborish</h3>
            <textarea id="msg" style="width:100%; height:100px; margin-bottom:10px;"></textarea>
            <button class="btn" onclick="send()">Yuborish</button>
        </div>
    </div>

    <script>
        console.log("Script boshlandi");
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        
        async function start() {
            const status = document.getElementById('loader-status');
            const loader = document.getElementById('loader');

            try {
                if (tg) {
                    tg.ready();
                    tg.expand();
                    console.log("Telegram WebApp tayyor");
                }

                if (!tg || !tg.initData) {
                    console.error("initData yo'q");
                    loader.innerHTML = '<div class="error-box"><h3>Xatolik!</h3><p>Iltimos, Telegram orqali kiring.</p></div>';
                    return;
                }

                status.innerText = "Ma'lumotlar olinmoqda...";
                const res = await fetch('/api/admin/stats', {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });

                if (!res.ok) throw new Error("Server xatosi: " + res.status);
                const data = await res.json();
                console.log("Ma'lumotlar keldi:", data);

                document.getElementById('s-users').innerText = data.total_users;
                document.getElementById('s-tests').innerText = data.total_tests;
                
                loader.classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');

            } catch (err) {
                console.error("Xato:", err);
                loader.innerHTML = `<div class="error-box"><h3>Xatolik!</h3><p>${err.message}</p><button class="btn" onclick="location.reload()">Qayta urinish</button></div>`;
            }
        }

        async function send() {
            const text = document.getElementById('msg').value;
            if(!text) return alert("Matn yozing");
            try {
                const res = await fetch('/api/admin/broadcast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData },
                    body: JSON.stringify({ text })
                });
                alert("Yuborildi!");
            } catch (e) { alert("Xato!"); }
        }

        // Ishga tushirish
        start();
    </script>
</body>
</html>
