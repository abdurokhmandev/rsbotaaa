<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEFRchi AI — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#06070d;
  --s1:#0c0e18;
  --s2:#111425;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;
  --muted:#5a6180;
  --accent:#c8f264;
  --accent2:#7b6cff;
  --accent3:#ff6b6b;
}

body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

/* fon glow */
.bg-glow{position:fixed;pointer-events:none;z-index:0;}
.glow-1{
  top:-180px;right:-120px;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(200,242,100,0.07) 0%,transparent 70%);
}
.glow-2{
  bottom:-200px;left:-100px;
  width:460px;height:460px;
  background:radial-gradient(circle,rgba(123,108,255,0.07) 0%,transparent 70%);
}

/* grid pattern */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
}

/* karta */
.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:420px;
}

.login-card{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px 36px;
  box-shadow:0 32px 64px rgba(0,0,0,0.5);
  animation:fadeUp 0.45s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

/* logo */
.logo-wrap{
  display:flex;align-items:center;gap:10px;
  justify-content:center;
  margin-bottom:32px;
}
.logo-mark{
  width:38px;height:38px;
  background:var(--accent);
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#06070d;font-weight:800;
}
.logo-text{
  font-family:'Syne',sans-serif;
  font-size:20px;font-weight:800;letter-spacing:-0.3px;
}
.logo-text span{color:var(--accent);}

/* sarlavha */
.login-head{text-align:center;margin-bottom:30px;}
.login-head h2{
  font-family:'Syne',sans-serif;
  font-size:22px;font-weight:800;
  letter-spacing:-0.4px;margin-bottom:6px;
}
.login-head p{font-size:13px;color:var(--muted);line-height:1.6;}

/* divider */
.divider{
  height:1px;
  background:linear-gradient(to right,transparent,var(--border),transparent);
  margin-bottom:28px;
}

/* form */
.form-group{margin-bottom:16px;}
.form-group label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}

.input-wrap{position:relative;}
.input-icon{
  position:absolute;left:14px;top:50%;
  transform:translateY(-50%);
  font-size:14px;pointer-events:none;opacity:0.45;
}
input{
  width:100%;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--border);
  padding:13px 14px 13px 40px;
  border-radius:12px;
  color:var(--text);
  font-family:inherit;font-size:14px;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
input::placeholder{color:var(--muted);}
input:focus{
  border-color:rgba(200,242,100,0.35);
  box-shadow:0 0 0 3px rgba(200,242,100,0.07);
  background:rgba(0,0,0,0.45);
}

.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:14px;
  transition:color 0.2s;padding:4px;
  line-height:1;
}
.eye-btn:hover{color:var(--text);}

/* error */
.error-box{
  background:rgba(255,107,107,0.08);
  border:1px solid rgba(255,107,107,0.2);
  border-radius:11px;
  padding:12px 14px;
  font-size:13px;color:var(--accent3);
  margin-bottom:16px;
  display:none;
  align-items:center;gap:8px;
}
.error-box.show{display:flex;}

/* button */
.btn-login{
  width:100%;margin-top:8px;
  padding:14px;border-radius:12px;
  border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;
  letter-spacing:0.3px;
  background:var(--accent);color:#06070d;
  transition:all 0.2s;
  position:relative;
}
.btn-login:hover:not(:disabled){
  background:#d4f47a;
  transform:translateY(-1px);
  box-shadow:0 8px 24px rgba(200,242,100,0.2);
}
.btn-login:active:not(:disabled){transform:translateY(0);}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.btn-login.loading::after{
  content:'';
  position:absolute;right:16px;top:50%;
  transform:translateY(-50%);
  width:15px;height:15px;
  border:2px solid rgba(6,7,13,0.25);
  border-top-color:#06070d;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg);}}

/* footer */
.login-footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;color:var(--muted);
  font-family:'DM Mono',monospace;
  letter-spacing:0.3px;
}
.login-footer span{color:var(--accent);opacity:0.8;}

/* mobil */
@media(max-width:480px){
  .login-card{padding:28px 20px;border-radius:20px;}
  .login-head h2{font-size:20px;}
}
</style>
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<div class="login-wrap">
  <div class="login-card">

    <div class="logo-wrap">
      <div class="logo-mark">C</div>
      <div class="logo-text">CEFR<span>chi</span></div>
    </div>

    <div class="login-head">
      <h2>Xush kelibsiz</h2>
      <p>Admin paneliga kirish uchun<br>ma'lumotlaringizni kiriting</p>
    </div>

    <div class="divider"></div>

    <div class="error-box" id="error-msg">
      <span>⚠</span>
      <span>Login yoki parol xato. Qaytadan urining.</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">

      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <span class="input-icon">◉</span>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">◈</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" onclick="togglePass()" id="eye-btn">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">Kirish →</button>

    </form>
  </div>

  <div class="login-footer">
    CEFRchi AI &nbsp;·&nbsp; <span>v2.0</span> &nbsp;·&nbsp; Admin only
  </div>
</div>

<script>
const API_BASE='https://web-production-69ee71.up.railway.app';

async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('error-msg');

  btn.textContent='Yuklanmoqda';
  btn.classList.add('loading');
  btn.disabled=true;
  err.classList.remove('show');

  const formData=new FormData();
  formData.append('username',document.getElementById('username').value);
  formData.append('password',document.getElementById('password').value);

  try{
    const res=await fetch(`${API_BASE}/login`,{
      method:'POST',body:formData,credentials:'include'
    });
    if(res.ok){
      window.location.href='admin.html';
    }else{
      showError(btn,err);
    }
  }catch(ex){
    showError(btn,err);
  }
}

function showError(btn,err){
  err.classList.add('show');
  btn.textContent='Kirish →';
  btn.classList.remove('loading');
  btn.disabled=false;
  document.getElementById('password').value='';
  document.getElementById('password').focus();
}

function togglePass(){
  const inp=document.getElementById('password');
  const btn=document.getElementById('eye-btn');
  const isHidden=inp.type==='password';
  inp.type=isHidden?'text':'password';
  btn.textContent=isHidden?'🙈':'👁';
}
</script>
</body>
</html>
